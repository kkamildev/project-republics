<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Perlin Terrain Colors</title>
<style>
  body { background:#111; color:#eee; font-family:sans-serif; }
  canvas { display:block; margin:20px auto; border:1px solid #555; image-rendering:pixelated; }
</style>
</head>
<body>

<canvas id="terrain" width="1024" height="1024"></canvas>

<script>
// ===== TRUE PERLIN (Ken Perlin, permutation table) =====

// Permutation table (deterministic)
const p = new Uint8Array(512);
const permutation = [
  151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,
  69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,
  252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,
  171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,
  122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,
  63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,
  188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,
  38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,
  42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,
  43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,
  218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,
  145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,
  115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,
  141,128,195,78,66,215,61,156,180
];

// Duplicate table
for (let i = 0; i < 512; i++) p[i] = permutation[i % 256];

function fade(t) {
  return t * t * t * (t * (t * 6 - 15) + 10);
}

function lerp(a, b, t) {
  return a + t * (b - a);
}

function grad(hash, x, y) {
  switch (hash & 3) {
    case 0: return  x + y;
    case 1: return -x + y;
    case 2: return  x - y;
    default: return -x - y;
  }
}

function perlin(x, y) {
  const xi = Math.floor(x) & 255;
  const yi = Math.floor(y) & 255;

  const xf = x - Math.floor(x);
  const yf = y - Math.floor(y);

  const u = fade(xf);
  const v = fade(yf);

  const aa = p[p[xi] + yi];
  const ab = p[p[xi] + yi + 1];
  const ba = p[p[xi + 1] + yi];
  const bb = p[p[xi + 1] + yi + 1];

  const x1 = lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u);
  const x2 = lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u);

  return (lerp(x1, x2, v) + 1) * 0.5;
}

// ===== Render terrain colors =====
const canvas = document.getElementById("terrain");
const ctx = canvas.getContext("2d");

const size = 1024;
const scale = 0.015;

const img = ctx.createImageData(size, size);
const data = img.data;

// kolorowanie terenu
function terrainColor(n) {
  if (n < 0.30) return [20, 40, 120];     // deep water
  if (n < 0.35) return [30, 70, 160];     // water
  if (n < 0.40) return [210, 190, 140];   // sand
  if (n < 0.55) return [60, 140, 60];     // grass
  if (n < 0.65) return [40, 110, 40];     // dark grass
  if (n < 0.75) return [120, 90, 50];     // dirt
  if (n < 0.85) return [130, 130, 130];   // rock
  return [255, 255, 255];                 // snow
}

for (let y = 0; y < size; y++) {
  for (let x = 0; x < size; x++) {
    const n = perlin(x * scale, y * scale);
    const [r, g, b] = terrainColor(n);

    const i = (y * size + x) * 4;
    data[i] = r;
    data[i+1] = g;
    data[i+2] = b;
    data[i+3] = 255;
  }
}

ctx.putImageData(img, 0, 0);
</script>

</body>
</html>
